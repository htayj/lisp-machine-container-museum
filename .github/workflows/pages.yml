name: Publish museum documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "scripts/build-docs-site.py"
      - "tests/test_docs_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          python -m pip install --require-hashes --requirement site/requirements.txt

      - name: Fetch pinned Genera font reproduction
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/htayj/genera-fonts/releases/download/v0.1.1/Genera-fonts-latin-v0.1.1.tar.gz \
            --output "${RUNNER_TEMP}/Genera-fonts-latin-v0.1.1.tar.gz"
          echo "a72cfaa9ed6c418ba751d4a32d3cf715b1b3e6edd44acdc144f297d0c915b3cf  ${RUNNER_TEMP}/Genera-fonts-latin-v0.1.1.tar.gz" \
            | sha256sum --check

      - name: Test site generator
        run: python -m unittest tests.test_docs_site

      - name: Build museum site
        run: |
          python scripts/build-docs-site.py \
            --font-archive "${RUNNER_TEMP}/Genera-fonts-latin-v0.1.1.tar.gz"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
